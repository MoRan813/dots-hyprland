<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    CJK fallback.

    1) Always keep Noto Sans CJK SC at the tail of every font pattern's family
       list (weak). Fonts like "Google Sans Flex" / "JetBrains Mono NF" carry no
       Han glyphs; without this, Qt apps that hard-code a family (quickshell bar,
       media widget, window titles) render Han characters as tofu.
    2) When the request is lang=zh, pull SC to the front so glyph shapes are
       Simplified rather than TC/JP/KR shapes.
  -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
</fontconfig>
