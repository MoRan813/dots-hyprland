# 空闲策略：不自动锁屏、不自动睡眠。
# 只有手动触发才生效：
#   SUPER + L                    → loginctl lock-session → lock_cmd（锁屏）
#   systemctl suspend / 关机菜单 → before_sleep_cmd（挂起前先锁屏）
# 改了本文件需重启 hypridle 才生效（hypridle 不热加载）：
#   kill $(pidof hypridle); hyprctl dispatch exec hypridle
# 恢复「一段时间自动锁 / 睡」的旧行为：cp 同目录 hypridle.conf.bak.* 覆盖回去再重启

$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock

general {
    lock_cmd = $lock_cmd
    # 手动挂起 / 休眠前先锁屏
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

# 关闭屏幕（DPMS off）保留：只让显示器休眠，不锁屏、不挂起，动一下鼠标即恢复。
# 连这个也不要的话，注释掉下面整段。
listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

